# =============================================================================
# READY-MADE VARIANT — for when the project sits inside a folder in the repo
#
# This is public/admin/config.yml with one change: the five file paths are
# prefixed with astro-blog/, because the CMS writes paths relative to the
# REPOSITORY ROOT, and your repository looks like:
#
#     The-slow-draft/            ← repository root
#     └── astro-blog/            ← the project (Netlify "Base directory")
#         └── src/content/blog/  ← where posts actually live
#
# HOW TO USE
#   1. On GitHub, open  astro-blog/public/admin/config.yml
#   2. Press the pencil (Edit this file)
#   3. Select everything (Ctrl+A / Cmd+A) and paste this whole file over it
#   4. Commit changes
#
# If you ever move the project to the top of the repository instead, go back to
# the original public/admin/config.yml in the project (the paths there have no
# astro-blog/ prefix).
# =============================================================================

# =============================================================================
# Decap CMS — the writing desk at /admin/
#
# Everything the editor shows is defined here. Each collection points at the
# markdown folders Astro already reads, and every field below matches the
# validated frontmatter in src/content.config.ts.
#
# Before this works on Netlify you need Identity + Git Gateway switched on.
# The checklist is in README.md → "Writing from the browser".
# =============================================================================

backend:
  name: git-gateway # Netlify's Identity-backed git proxy. See the GitHub/Vercel
  branch: main #      alternative at the bottom of this file.

# Lets you edit locally with the real dashboard and no Netlify account:
#
#   npm run dev            # terminal 1 — the site on :4321
#   npx decap-server       # terminal 2 — the CMS backend on :8081
#
# then open http://localhost:4321/admin/ and press "Login" (no password) —
# Decap writes straight to your working copy, so `git diff` shows the changes.
# Harmless in production: it only activates when that local proxy is running.
local_backend: true

# Where the "Publish"/"Save" button commits. Set to "editorial_workflow" and
# Decap opens a pull request instead of committing straight to main — nice if
# you want a review step, or a deploy preview to check before it goes live.
publish_mode: simple

site_url: https://the-slow-draft.example
display_url: https://the-slow-draft.example
logo_url: /favicon.svg

# -----------------------------------------------------------------------------
# Media
# -----------------------------------------------------------------------------
# Uploads land in the repo at public/uploads/ and are served from /uploads/…
# (Astro copies public/ into the built site unchanged.) Drop any image into a
# post and it is committed alongside it, so the whole post is one atomic change.
media_folder: astro-blog/public/uploads
public_folder: /uploads
media_library:
  name: default
  config:
    multiple: true

# -----------------------------------------------------------------------------
# Blog posts — src/content/blog/
# -----------------------------------------------------------------------------
collections:
  - name: blog
    label: Blog posts
    label_singular: Post
    description: >-
      One markdown file per post. The filename becomes the URL, so
      "my new post" is published at /blog/my-new-post/.
    folder: astro-blog/src/content/blog
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: '{{slug}}' # kebab-case filename from the title
    identifier_field: title
    preview_path: 'blog/{{slug}}' # the "view live" link inside the editor
    summary: '{{title}} — {{date}}'
    sortable_fields: [date, title]
    view_filters:
      - label: Published
        field: draft
        pattern: false
      - label: Drafts
        field: draft
        pattern: true
    fields:
      - name: title
        label: Title
        widget: string
        hint: The headline readers see. Also becomes the web address unless you change the filename.
      - name: date
        label: Publish date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        default: '{{now}}'
        hint: Backdate a post if you are importing older writing.
      - name: updated
        label: Last updated
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        required: false
        hint: Leave empty unless the post changed after it was first published.
      - name: summary
        label: Summary
        widget: text
        required: false
        hint: One or two sentences shown on cards, in search results and in the RSS feed.
      - name: tags
        label: Tags
        widget: list
        required: false
        default: []
        hint: Each tag gets its own page at /blog/tag/…
      - name: featured
        label: Feature on the home page
        widget: boolean
        default: false
        hint: The big story at the top of the home page.
      - name: draft
        label: Draft (not published yet)
        widget: boolean
        default: true
        hint: While this is on, the post is left out of the build entirely — no page, no feed entry, no sitemap listing.
      - name: cover
        label: Cover image
        widget: image
        required: false
        choose_url: true
        hint: Optional. Shown above the post.
      - name: body
        label: Body
        widget: markdown
        hint: >-
          Markdown. For the coloured pens and typefaces, paste the HTML from an
          existing post: <span class="c-terracotta">terracotta</span>,
          <mark class="hl-yellow">highlight</mark>,
          <span class="f-playfair">Playfair</span>.

  # ---------------------------------------------------------------------------
  # Resources — src/content/resources/  (the /resources/ page)
  # ---------------------------------------------------------------------------
  - name: resources
    label: Resources
    label_singular: Resource
    description: Links you recommend, grouped by category on the Resources page.
    folder: astro-blog/src/content/resources
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}} — {{category}}'
    fields:
      - { name: title, label: Title, widget: string }
      - name: url
        label: URL
        widget: string
        pattern: ['^https?://.+', 'Must start with http:// or https://']
      - name: category
        label: Category
        widget: string
        default: General
        hint: Resources are grouped under this heading, in the order the categories first appear.
      - name: description
        label: Why it is worth it
        widget: text
        required: false
      - name: order
        label: Sort order
        widget: number
        value_type: int
        default: 0
        required: false
        hint: Lower numbers come first.

  # ---------------------------------------------------------------------------
  # Page copy — src/content/pages/  (single files, not a folder)
  # ---------------------------------------------------------------------------
  - name: pages
    label: Pages
    description: The words on the About and Resources pages.
    files:
      - name: about
        label: About page
        file: astro-blog/src/content/pages/about.md
        fields:
          - { name: eyebrow, label: Small label above the heading, widget: string, required: false }
          - { name: heading, label: Heading, widget: string }
          - { name: body, label: Body, widget: markdown }
      - name: resources
        label: Resources page intro
        file: astro-blog/src/content/pages/resources.md
        fields:
          - { name: eyebrow, label: Small label above the heading, widget: string, required: false }
          - { name: heading, label: Heading, widget: string }
          - { name: body, label: Introduction, widget: markdown }

# =============================================================================
# Not deploying to Netlify?
#
# git-gateway is a Netlify service. On Vercel, GitHub Pages, Cloudflare or a
# plain server, log in with a GitHub OAuth app instead — replace the `backend`
# block above with:
#
#   backend:
#     name: github
#     repo: haydaycreates/The-slow-draft
#     branch: main
#     base_url: https://your-oauth-broker.example.com   # an OAuth broker
#     auth_endpoint: auth
#
# and follow https://decapcms.org/docs/github-backend/ for the OAuth side.
# Everything else in this file stays exactly the same.
# =============================================================================
